<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Obsidian field -->
  <rect width="1200" height="630" fill="#08080B"/>

  <!-- Subtle gold radial vignette -->
  <defs>
    <radialGradient id="g" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E8C76F" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#E8C76F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>

  <!-- Thin gold double rule, top -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#E8C76F" stroke-width="1" opacity="0.9"/>
  <line x1="80" y1="90" x2="1120" y2="90" stroke="#E8C76F" stroke-width="1" opacity="0.4"/>

  <!-- Eyebrow -->
  <text x="80" y="140"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="16" letter-spacing="6"
        fill="#F5F1E8" fill-opacity="0.6">— VOL. I · MANUSCRIPT OF THE CLOSER</text>

  <!-- Wordmark -->
  <text x="80" y="370"
        font-family="'Instrument Serif', 'Times New Roman', serif"
        font-size="220" font-style="italic" fill="#F5F1E8">Pitch<tspan font-style="italic" fill="#E8C76F">Viper</tspan></text>

  <!-- Tagline -->
  <text x="80" y="470"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="26" letter-spacing="10"
        fill="#F5F1E8" fill-opacity="0.85">WHERE  CLOSERS  ARE  MADE</text>

  <!-- Thin gold double rule, bottom -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#E8C76F" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="550" x2="1120" y2="550" stroke="#E8C76F" stroke-width="1" opacity="0.9"/>

  <!-- Bottom mono microtype -->
  <text x="80" y="585"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="14" letter-spacing="4"
        fill="#F5F1E8" fill-opacity="0.5">SALES TEAM PERFORMANCE · EST. 2026</text>
  <text x="1120" y="585" text-anchor="end"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="14" letter-spacing="4"
        fill="#F5F1E8" fill-opacity="0.5">PITCHVIPER.COM</text>
</svg>
